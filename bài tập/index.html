<body>
    <!-- Đầu trang -->

        <!-- Danh mục -->
        <nav class="danh-muc">
            <ul class="danh-sach-muc">
                <img class="logo" src="../ảnh/logoNF.svg" alt="">
                <li class="muc dang-chon"><a class="lien-ket-muc dang-chon" href="#"><font face="arial">Trang chủ</font></a></li>
                <li class="muc"><a class="lien-ket-muc" href="#"><font face="arial">Nhân vật</font></a></li>

            <div></div>

            <img class="avata" src="../ảnh/avt.jpg" alt="">

    <!-- Nội dung chính trang -->
    <main>
        <div class="banner">
            <iframe class="banner-img" src="https://www.youtube.com/embed/nDpHA4nms-A?si=QteH0DENZbNl5qLY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>        </div>
        <div class="the-loai">
            <div class="ten-the-loai">
                <h3>Có thể bạn sẽ mê các tác phẩm này</h3>
            </div>
            <div class="danh-sach-phim">
                <div onclick="chonPhim(1)" class="phim">
                    <img class="anh-bai" src="1.avif" alt="">
                </div>
                <div onclick="chonPhim(2)" class="phim">

                </div>
                <div onclick="chonPhim(3)" class="phim">

                <div onclick="chonPhim(4)" class="phim">

                </div>
                <div onclick="chonPhim(5)" class="phim">
                    <img class="anh-bai" src="5.avif" alt="">
                </div>
            </div>
        </div>
        </div>
