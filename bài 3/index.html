<html>
    <head>
        <title>bài 3 web</title>
    </head>
    <body>
        <MARQUEE>
            <img src="../ảnh/htmp.jpg">
        </MARQUEE>
        <!-- ol Danh sách có thứ tự -->
         <ol>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
         </ol>

         <!-- ul Danh sách không có thứ tự -->
         <ul>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
         </ul>


         <h1>Form đăng ký</h1>
         <form>
            <div>
                <b>Họ và tên</b><br>
                <!-- nếu input không có type thì sẽ  -->
                <!-- mặc định là text -->
                <!-- thuộc tính readonly sử dụng khi -->
                <!-- không muốn người dùng nhập -->
                <!-- thông tin vào input -->
                <input type="text" placeholder="Họ và tên">
            </div>
            <div>
                <b>Năm sinh</b><br>
                <input type="number" placeholder="Năm sinh">
            </div>
            <div>
                <b>Mật khẩu</b><br>
                <input type="password" placeholder="Mật khẩu"> 
            </div>
            <div>
                <b>Giới thiệu về bản thân</b><br>
                <textarea>Nhập thông tin...</textarea>  
            </div>
             <div>
                <b>Email</b><br>
                <input type="email"> 
            </div>
            <div>
                <!-- Số đầu tiên: 0 -->
                <!-- Số thứ 2: 3, 9, 8 -->   
                <!-- 8 số còn lại: 0-9 -->
                <b>Số điện thoại</b><br>
                <input type="tel" pattern="([0]{1}[3, 9, 8]{1}[0-9]{8})"> 
            </div>
            <div>
                <b>Giới tính</b><br>
                <input type="radio" name="gioitinh" value="nam"> Nam<br>
                <input type="radio" name="gioitinh" value="nu"> Nữ
            </div>
            <div>
                <b>Sở thích</b><br>
                Chơi game: <input type="checkbox" name="sothich" value="choigame"><br>
                Nghe nhạc: <input type="checkbox" name="sothich" value="nghe nhac"><br>
                Thể thao: <input type="checkbox" name="sothich" value="thethao"><br>
            </div>
            <div>
                <b>Trình duyệt web ưa thích</b><br>
                <select name="browers">
                    <option value="Internet Explorer">Internet Explorer</option>
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="Safari">Safari</option>
                    <option value="Cốc Cốc">Cốc cốc</option>
                    <option value="Opera">Opera</option>
                </select>
            </div>
            <!-- 0 <input type="range" id="a" value="50"> 100 -->
            <div>
                <input type="submit">
                <button>Xác nhận</button>
                <input type="reset">
            </div>
        </form>
        <div>
                <iframe
                width="560" 
                height="315" 
                src="https://www.youtube.com/embed/nSAzMCsEPME?si=fWucENtzbm276vmj" ></iframe>
        </div>
        <div>
            <video controls width="560" height="315">
                <source src="/ảnh/bff.mp4" type="video/mp4">
            </video>
        </div>
        <div>
            <audio controls>
                <source src="/ảnh/audio1.m4a" type="audio/mp3">
            </audio>
        </div>
    </body>
</html>
